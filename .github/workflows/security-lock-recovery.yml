name: Recover audited web lock
on:
  push:
    branches: ['foundation/**']
    paths: ['.github/workflows/security-lock-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover exact audit candidate without changing repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 46040128343 --repo ERLab-ai/SATAC --name security-web-candidate --dir "$RUNNER_TEMP/security-web"
          cd "$RUNNER_TEMP/security-web"
          echo '0cb81ca77931f5a6a6a061281024804d4cb47697eebb0a94d75ecef93e61fd84  package-lock.json' | sha256sum -c -
          python -c 'import base64;from pathlib import Path;s=base64.b64encode(Path("package-lock.json").read_bytes()).decode();print("\n".join(f"LOCKCHUNK:{i//1000:04d}:"+s[i:i+1000] for i in range(0,len(s),1000)))'
