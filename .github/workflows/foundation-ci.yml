name: Foundation reference checks
on:
  push:
    branches: ['foundation/**']
  pull_request:
    branches: ['foundation/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m unittest discover -s tests -v
