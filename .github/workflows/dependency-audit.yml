name: Dependency vulnerability inventory
on:
  push:
    branches: ['foundation/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Audit exact npm lock
        run: |
          mkdir -p audit-results
          set +e
          (cd apps/web && npm audit --package-lock-only --json) > audit-results/npm.json
          rc=$?
          set -e
          echo "$rc" > audit-results/npm.exit
          python -c 'import json;d=json.load(open("audit-results/npm.json"));assert "metadata" in d and "vulnerabilities" in d and "error" not in d;print("npm severity inventory",d["metadata"]["vulnerabilities"])'
      - name: Install isolated audit scanner
        run: python -m pip install pip-audit==2.9.0
      - name: Audit exact Python version locks
        run: |
          mkdir -p audit-results
          for item in api geography; do
            if [ "$item" = api ]; then lock=apps/api/requirements.lock.txt; else lock=pipelines/legacy_geography/requirements.txt; fi
            set +e
            python -m pip_audit --no-deps --disable-pip -r "$lock" --format json --output "audit-results/$item.json" --progress-spinner off
            rc=$?
            set -e
            echo "$rc" > "audit-results/$item.exit"
            python -c 'import json,sys;d=json.load(open(sys.argv[1]));assert isinstance(d,dict) and "dependencies" in d and all("vulns" in x or "skip_reason" in x for x in d["dependencies"]);print(sys.argv[1], "vulnerable dependencies", sum(bool(x.get("vulns")) for x in d["dependencies"]), "skipped",sum("skip_reason" in x for x in d["dependencies"]))' "audit-results/$item.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-reports
          path: audit-results
          if-no-files-found: warn
