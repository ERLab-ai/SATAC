name: Security upgrade candidates
on:
  push:
    branches: ['foundation/**']
    paths:
      - '.github/workflows/security-upgrade-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve advisory-targeted exact versions
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact maplibre-gl@6.20.0
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact vite@6.4.6
          mkdir -p ../../candidate-results
          cp package.json package-lock.json ../../candidate-results/
          sha256sum package-lock.json
          npm ci --no-audit --no-fund
      - name: Audit proposed lock
        working-directory: apps/web
        run: |
          rc=0
          npm audit --package-lock-only --json > ../../candidate-results/npm.json || rc=$?
          echo "$rc" > ../../candidate-results/npm.exit
          python -c 'import json;d=json.load(open("../../candidate-results/npm.json"));assert "vulnerabilities" in d and "error" not in d;print("CANDIDATE npm",d["metadata"]["vulnerabilities"])'
      - name: Typecheck and build proposed upgrade
        working-directory: apps/web
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-web-candidate
          path: candidate-results
          if-no-files-found: warn
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Resolve FastAPI compatible with advisory target
        run: |
          mkdir -p candidate-results
          python -m venv /tmp/satac-api-candidate
          /tmp/satac-api-candidate/bin/pip install pip==26.3
          /tmp/satac-api-candidate/bin/pip install --no-deps -r apps/api/requirements.lock.txt
          /tmp/satac-api-candidate/bin/pip install --upgrade --only-binary=:all: fastapi starlette==1.3.1 --report candidate-results/api-resolution.json
          /tmp/satac-api-candidate/bin/pip check
          /tmp/satac-api-candidate/bin/pip freeze > candidate-results/api.lock.txt
          cat candidate-results/api.lock.txt
          /tmp/satac-api-candidate/bin/python -c 'from apps.api.main import app; assert "/api/v1/explore" in app.openapi()["paths"]'
      - name: Audit proposed Python lock
        run: |
          python -m pip install pip-audit==2.9.0
          rc=0
          python -m pip_audit --no-deps --disable-pip -r candidate-results/api.lock.txt --format json --output candidate-results/api.json --progress-spinner off || rc=$?
          echo "$rc" > candidate-results/api.exit
          python -c 'import json;d=json.load(open("candidate-results/api.json"));assert "dependencies" in d;print("CANDIDATE API",[(x["name"],len(x.get("vulns",[]))) for x in d["dependencies"] if x.get("vulns") or "skip_reason" in x])'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-api-candidate
          path: candidate-results
          if-no-files-found: warn
  geography:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Test security upgrade without changing approved baseline
        run: |
          mkdir -p candidate-results
          sed -e 's/^pillow==12.3.0$/pillow==13.0.0/' -e 's/^certifi==2026.5.20$/certifi==2026.11.20/' pipelines/legacy_geography/requirements.txt > candidate-results/geography.lock.txt
          python -m venv /tmp/satac-geo-candidate
          /tmp/satac-geo-candidate/bin/pip install pip==26.3
          /tmp/satac-geo-candidate/bin/pip install --no-deps -r candidate-results/geography.lock.txt
          /tmp/satac-geo-candidate/bin/pip check
          /tmp/satac-geo-candidate/bin/python pipelines/prepare_web_geography.py --output candidate-results/physical
          python pipelines/verify_web_assets.py --root candidate-results/physical
      - name: Audit proposed geography lock
        if: always()
        run: |
          test -f candidate-results/geography.lock.txt
          python -m pip install pip-audit==2.9.0
          rc=0
          python -m pip_audit --no-deps --disable-pip -r candidate-results/geography.lock.txt --format json --output candidate-results/geography.json --progress-spinner off || rc=$?
          echo "$rc" > candidate-results/geography.exit
          python -c 'import json;d=json.load(open("candidate-results/geography.json"));assert "dependencies" in d;print("CANDIDATE geography",[(x["name"],len(x.get("vulns",[]))) for x in d["dependencies"] if x.get("vulns") or "skip_reason" in x])'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-geography-candidate
          path: candidate-results
          if-no-files-found: warn
