worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format satac '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout satac;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=public_reads:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=public_connections:10m;
  limit_req_status 429;
  limit_conn_status 429;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    location ~ ^/(api/|health$|ready$) {
      limit_req zone=public_reads burst=40 nodelay;
      limit_conn public_connections 16;
      limit_except GET { deny all; }
      proxy_pass $api$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host api;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 10s;
      proxy_hide_header Cache-Control;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
    }
    # Check data and art access on every request before serving static bytes.
    location ~ ^/(physical/|legacy-art/|land[.]geojson$) {
      set $asset_path $uri;
      auth_request /_asset_access;
      limit_except GET { deny all; }
      try_files $uri =404;
    }
    location = /_asset_access {
      internal;
      proxy_pass $api/_asset-access;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-SATAC-Asset $asset_path;
      proxy_set_header Host api;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }
    # ES module workers require JavaScript MIME, including on nginx builds
    # whose default mime.types does not list .mjs.
    location ~ \.mjs$ { types { application/javascript mjs; } try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
  }
}
